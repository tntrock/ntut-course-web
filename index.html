<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 行動版瀏覽器的網址列顏色。深淺色各給一組,不然其中一邊會很突兀 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
    <!--
      字型。中文用 Noto Sans TC,拉丁字母與數字用 Inter。

      不指定的話 Windows 會拿 Segoe UI 排拉丁、微軟正黑體排中文,同一行
      「3D列印理論與實務」就是兩套字體設計,粗細與字面大小都對不起來。

      用**可變字重**而不是列舉 400/500/600:實測同一個 CJK 分片,可變版 61 KB、
      單一字重 32 KB —— 可變版跟「兩種靜態字重」同價,但拿到全部字重。
      Google Fonts 依 unicode-range 切片,只會下載頁面真的用到的那幾片。

      `display=swap`:字型還沒到之前先用系統字型顯示,不留白。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+TC:wght@100..900&display=swap"
    />
    <title>北科課程</title>
    <meta
      name="description"
      content="臺北科技大學課程查詢:關鍵字搜尋、多維篩選、教學大綱、我的課表。非官方網站。"
    />
    <script>
      // 在第一次繪製前決定主題,避免深色模式閃白
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('ntut-course-web:v1') || '{}')
          var theme = (saved.settings && saved.settings.theme) || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 不可用時就用淺色,不影響功能 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-MG58NE4C01"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      // 換路由的 page_view 由 src/lib/analytics.ts 送,這裡不重複送第一次
      gtag('config', 'G-MG58NE4C01', { send_page_view: false })
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "b0f4b2f063c74614827b8e783f48253a"}'
    ></script>
  </body>
</html>
